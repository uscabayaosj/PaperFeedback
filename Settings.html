<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter Settings</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.5;
      color: #333;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
    }
    h2 {
      color: #1a1a2e;
      font-size: 20px;
      margin: 0 0 4px 0;
    }
    .subtitle {
      color: #6b7280;
      font-size: 13px;
      margin: 0 0 20px 0;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: #374151;
      margin-bottom: 4px;
    }
    .hint {
      font-weight: 400;
      color: #9ca3af;
      font-size: 11px;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
    }
    select {
      appearance: auto;
      background: #fff;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      align-items: center;
    }
    .btn-primary {
      background: #3498db;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #2980b9; }
    .btn-primary:disabled {
      background: #a0c4e8;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #d1d5db; }
    #result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    #result.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    #result.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .model-suggestions {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <h2>⚙ OpenRouter Settings</h2>
  <p class="subtitle">Configure your OpenRouter API connection and model preferences. Settings are saved per user.</p>

  <div class="field">
    <label for="apiKey">OpenRouter API Key <span class="hint">(required)</span></label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off" />
  </div>

  <div class="field">
    <label for="baseUrl">API Base URL <span class="hint">(optional — defaults to OpenRouter)</span></label>
    <input type="text" id="baseUrl" placeholder="https://openrouter.ai/api/v1" />
  </div>

  <div class="field">
    <label for="visionModel">Model for Rubric OCR <span class="hint">(vision-capable)</span></label>
    <select id="visionModel">
      <option value="openai/gpt-4o">openai/gpt-4o — Best all-round vision</option>
      <option value="anthropic/claude-3.5-sonnet">anthropic/claude-3.5-sonnet — Excellent doc reading</option>
      <option value="google/gemini-2.0-flash-001">google/gemini-2.0-flash-001 — Fast, cheap, good</option>
      <option value="openai/gpt-4o-mini">openai/gpt-4o-mini — Budget vision</option>
      <option value="qwen/qwen-vl-plus">qwen/qwen-vl-plus — Strong vision, low cost</option>
      <option value="__custom__">Custom model...</option>
    </select>
    <div class="model-suggestions" id="visionCustom" style="display:none;">
      <label for="visionModelCustom">Custom vision model slug:</label>
      <input type="text" id="visionModelCustom" placeholder="e.g., anthropic/claude-3-opus" />
    </div>
  </div>

  <div class="field">
    <label for="assessModel">Model for Writing Assessment <span class="hint">(text)</span></label>
    <select id="assessModel">
      <option value="openai/gpt-4o">openai/gpt-4o — Best all-round</option>
      <option value="anthropic/claude-3.5-sonnet">anthropic/claude-3.5-sonnet — Excellent feedback</option>
      <option value="anthropic/claude-3-opus">anthropic/claude-3-opus — Deep analysis (slower)</option>
      <option value="google/gemini-2.0-flash-001">google/gemini-2.0-flash-001 — Fast, cheap</option>
      <option value="meta-llama/llama-3.3-70b-instruct">meta-llama/llama-3.3-70b-instruct — Good, cheap</option>
      <option value="mistralai/mistral-large-2411">mistralai/mistral-large-2411 — Strong, mid-price</option>
      <option value="deepseek/deepseek-chat">deepseek/deepseek-chat — Very cheap, good</option>
      <option value="__custom__">Custom model...</option>
    </select>
    <div class="model-suggestions" id="assessCustom" style="display:none;">
      <label for="assessModelCustom">Custom assessment model slug:</label>
      <input type="text" id="assessModelCustom" placeholder="e.g., anthropic/claude-3-haiku" />
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="saveBtn" onclick="save()">Save Settings</button>
    <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
  </div>

  <div id="result"></div>

  <script>
    // Load current settings on open
    google.script.run
      .withSuccessHandler(function(s) {
        document.getElementById('apiKey').value = s.apiKey || '';
        document.getElementById('baseUrl').value = s.baseUrl || 'https://openrouter.ai/api/v1';

        // Set vision model select
        var visionSelect = document.getElementById('visionModel');
        var visionOption = visionSelect.querySelector('option[value="' + s.visionModel + '"]');
        if (visionOption) {
          visionSelect.value = s.visionModel;
        } else {
          visionSelect.value = '__custom__';
          document.getElementById('visionCustom').style.display = 'block';
          document.getElementById('visionModelCustom').value = s.visionModel || '';
        }

        // Set assess model select
        var assessSelect = document.getElementById('assessModel');
        var assessOption = assessSelect.querySelector('option[value="' + s.assessModel + '"]');
        if (assessOption) {
          assessSelect.value = s.assessModel;
        } else {
          assessSelect.value = '__custom__';
          document.getElementById('assessCustom').style.display = 'block';
          document.getElementById('assessModelCustom').value = s.assessModel || '';
        }
      })
      .loadSettings();

    // Show custom model input when "__custom__" is selected
    document.getElementById('visionModel').addEventListener('change', function() {
      document.getElementById('visionCustom').style.display = this.value === '__custom__' ? 'block' : 'none';
    });
    document.getElementById('assessModel').addEventListener('change', function() {
      document.getElementById('assessCustom').style.display = this.value === '__custom__' ? 'block' : 'none';
    });

    function getModel(selectId, customId) {
      var select = document.getElementById(selectId);
      return select.value === '__custom__'
        ? document.getElementById(customId).value.trim()
        : select.value;
    }

    function save() {
      var apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        showResult(false, 'API key is required.');
        return;
      }

      var saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      var settings = {
        apiKey: apiKey,
        baseUrl: document.getElementById('baseUrl').value.trim() || 'https://openrouter.ai/api/v1',
        visionModel: getModel('visionModel', 'visionModelCustom') || 'openai/gpt-4o',
        assessModel: getModel('assessModel', 'assessModelCustom') || 'openai/gpt-4o'
      };

      google.script.run
        .withSuccessHandler(function(result) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Settings';
          showResult(result.success, result.message);
          if (result.success) {
            setTimeout(function() { google.script.host.close(); }, 1200);
          }
        })
        .withFailureHandler(function(err) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Settings';
          showResult(false, 'Error: ' + err);
        })
        .saveSettings(settings);
    }

    function showResult(success, message) {
      var el = document.getElementById('result');
      el.textContent = message;
      el.className = success ? 'success' : 'error';
      el.style.display = 'block';
    }
  </script>
</body>
</html>
